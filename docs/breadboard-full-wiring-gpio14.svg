      <circle class="hole" cx="180" cy="480" r="6"/><circle class="hole" cx="210" cy="480" r="6"/><circle class="hole" cx="240" cy="480" r="6"/><circle class="hole" cx="270" cy="480" r="6"/><circle class="hole" cx="300" cy="480" r="6"/>
      <circle class="hole" cx="0" cy="520" r="6"/><circle class="hole" cx="30" cy="520" r="6"/><circle class="hole" cx="60" cy="520" r="6"/><circle class="hole" cx="90" cy="520" r="6"/><circle class="hole" cx="120" cy="520" r="6"/>
      <circle class="hole" cx="180" cy="520" r="6"/><circle class="hole" cx="210" cy="520" r="6"/><circle class="hole" cx="240" cy="520" r="6"/><circle class="hole" cx="270" cy="520" r="6"/><circle class="hole" cx="300" cy="520" r="6"/>
      <circle class="hole" cx="0" cy="560" r="6"/><circle class="hole" cx="30" cy="560" r="6"/><circle class="hole" cx="60" cy="560" r="6"/><circle class="hole" cx="90" cy="560" r="6"/><circle class="hole" cx="120" cy="560" r="6"/>
      <circle class="hole" cx="180" cy="560" r="6"/><circle class="hole" cx="210" cy="560" r="6"/><circle class="hole" cx="240" cy="560" r="6"/><circle class="hole" cx="270" cy="560" r="6"/><circle class="hole" cx="300" cy="560" r="6"/>
      <circle class="hole" cx="0" cy="600" r="6"/><circle class="hole" cx="30" cy="600" r="6"/><circle class="hole" cx="60" cy="600" r="6"/><circle class="hole" cx="90" cy="600" r="6"/><circle class="hole" cx="120" cy="600" r="6"/>
      <circle class="hole" cx="180" cy="600" r="6"/><circle class="hole" cx="210" cy="600" r="6"/><circle class="hole" cx="240" cy="600" r="6"/><circle class="hole" cx="270" cy="600" r="6"/><circle class="hole" cx="300" cy="600" r="6"/>
