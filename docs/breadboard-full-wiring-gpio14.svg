  <path class="wireg" d="M1075 1020 C1185 1030 1270 1048 1465 1070"/>
  <path class="wires" d="M425 1100 C760 1175 1240 1135 1590 1070"/>

  <!-- Button signal bundle to ESP pins -->
  <path class="wires" d="M425 457 C590 440 930 275 1220 298"/>
  <path class="wires" d="M425 497 C590 495 925 344 1220 368"/>
  <path class="wires" d="M425 537 C600 535 925 414 1220 438"/>
  <path class="wires" d="M425 577 C610 580 925 486 1220 508"/>
  <path class="wires" d="M425 777 C650 765 950 552 1220 578"/>
  <path class="wires" d="M425 897 C690 890 965 622 1220 648"/>
  <path class="wires" d="M425 937 C710 930 965 692 1220 718"/>
  <path class="wires" d="M425 1017 C735 1030 970 760 1220 788"/>
  <path class="wires" d="M425 1057 C765 1070 975 830 1220 858"/>

  <!-- Warnings -->
  <rect class="warn" x="70" y="1128" width="1660" height="88" rx="18"/>
  <text class="label" x="98" y="1165">注意</text>
  <text class="small" x="160" y="1165">1. 左红轨是 3V3，只给按钮 VCC。右红轨是 5V，只给灯环 VCC。两条红轨不要互相连。</text>
  <text class="small" x="160" y="1194">2. 黑色 GND 轨必须共地：按钮 GND、灯环 GND、ESP32 GND 都连在一起。</text>
