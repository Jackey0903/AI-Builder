<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <style>
      .bg { fill: #f6efdc; }
      .title { font: 800 42px Arial, Helvetica, sans-serif; fill: #211b18; }
      .subtitle { font: 24px Arial, Helvetica, sans-serif; fill: #5c5148; }
      .label { font: 700 23px Arial, Helvetica, sans-serif; fill: #211b18; }
      .small { font: 18px Arial, Helvetica, sans-serif; fill: #302821; }
      .tiny { font: 15px Arial, Helvetica, sans-serif; fill: #54493f; }
      .board { fill: #1f758a; stroke: #163b45; stroke-width: 5; }
      .usb { fill: #d9dee6; stroke: #333; stroke-width: 4; }
      .pin { fill: #fff; stroke: #2a2825; stroke-width: 2; }
      .pin-note { fill: #ffe28a; stroke: #2a2825; stroke-width: 2.5; }
      .pin-led { fill: #b7f4cb; stroke: #2a2825; stroke-width: 2.5; }
      .pin-power { fill: #ffd6d6; stroke: #2a2825; stroke-width: 2.5; }
      .pin-gnd { fill: #d7d7d7; stroke: #2a2825; stroke-width: 2.5; }
      .bread { fill: #fffaf0; stroke: #3a2c31; stroke-width: 4; }
      .hole { fill: #e6dfcf; stroke: #a59a87; stroke-width: 1; }
      .rail3 { fill: #f3a123; }
      .rail5 { fill: #e54838; }
      .railg { fill: #2e2e2e; }
      .railText { font: 700 20px Arial, Helvetica, sans-serif; fill: #fff; }
      .module { fill: #fff7de; stroke: #3a2c31; stroke-width: 3; }
      .buttonYellow { fill: #ffd84d; stroke: #3a2c31; stroke-width: 3; }
      .buttonRed { fill: #ff7171; stroke: #3a2c31; stroke-width: 3; }
      .buttonGreen { fill: #78d878; stroke: #3a2c31; stroke-width: 3; }
      .wire3 { fill: none; stroke: #f3a123; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .wire5 { fill: none; stroke: #e54838; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .wireg { fill: none; stroke: #202020; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .wires { fill: none; stroke: #18a457; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .warn { fill: #fff2b7; stroke: #aa7b13; stroke-width: 3; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1250"/>
  <text class="title" x="70" y="70">面包板完整接线图：按钮走 3V3，灯环走 5V，LED 信号接 GPIO14</text>
  <text class="subtitle" x="70" y="110">接线前先拔掉 USB。所有 GND 必须共地；3V3 轨和 5V 轨绝对不要连在一起。</text>

  <!-- ESP32 board -->
  <rect class="board" x="60" y="190" width="420" height="900" rx="28"/>
  <rect class="usb" x="185" y="145" width="160" height="68" rx="14"/>
  <text class="label" x="228" y="188">USB</text>
  <text class="label" x="135" y="255" fill="#fff">ESP32-S3</text>
  <text class="small" x="110" y="287" fill="#e5fbff">正面看板子，USB 在上</text>

  <!-- ESP J1 pins -->
  <g transform="translate(300,320)">
    <text class="label" x="-4" y="-24" fill="#fff">这一侧排针</text>
    <rect class="pin-power" x="0" y="0" width="125" height="34" rx="8"/><text class="small" x="14" y="24">3V3</text>
    <rect class="pin-power" x="0" y="40" width="125" height="34" rx="8"/><text class="small" x="14" y="64">3V3</text>
    <rect class="pin" x="0" y="80" width="125" height="34" rx="8"/><text class="small" x="14" y="104">RST</text>
    <rect class="pin-note" x="0" y="120" width="125" height="34" rx="8"/><text class="small" x="14" y="144">IO4 C</text>
    <rect class="pin-note" x="0" y="160" width="125" height="34" rx="8"/><text class="small" x="14" y="184">IO5 D</text>
    <rect class="pin-note" x="0" y="200" width="125" height="34" rx="8"/><text class="small" x="14" y="224">IO6 E</text>
    <rect class="pin-note" x="0" y="240" width="125" height="34" rx="8"/><text class="small" x="14" y="264">IO7 F</text>
    <rect class="pin" x="0" y="280" width="125" height="34" rx="8"/><text class="small" x="14" y="304">IO15</text>
    <rect class="pin" x="0" y="320" width="125" height="34" rx="8"/><text class="small" x="14" y="344">IO16</text>
    <rect class="pin" x="0" y="360" width="125" height="34" rx="8"/><text class="small" x="14" y="384">IO17</text>
    <rect class="pin" x="0" y="400" width="125" height="34" rx="8"/><text class="small" x="14" y="424">IO18</text>
    <rect class="pin-note" x="0" y="440" width="125" height="34" rx="8"/><text class="small" x="14" y="464">IO8 G</text>
    <rect class="pin" x="0" y="480" width="125" height="34" rx="8"/><text class="small" x="14" y="504">IO3</text>
    <rect class="pin" x="0" y="520" width="125" height="34" rx="8"/><text class="small" x="14" y="544">IO46</text>
    <rect class="pin-note" x="0" y="560" width="125" height="34" rx="8"/><text class="small" x="14" y="584">IO9 A</text>
    <rect class="pin-note" x="0" y="600" width="125" height="34" rx="8"/><text class="small" x="14" y="624">IO10 B</text>
    <rect class="pin" x="0" y="640" width="125" height="34" rx="8"/><text class="small" x="14" y="664">IO11</text>
    <rect class="pin-note" x="0" y="680" width="125" height="34" rx="8"/><text class="small" x="14" y="704">IO12 REC</text>
    <rect class="pin-note" x="0" y="720" width="125" height="34" rx="8"/><text class="small" x="14" y="744">IO13 GEN</text>
    <rect class="pin-led" x="0" y="760" width="125" height="34" rx="8"/><text class="small" x="14" y="784">IO14 LED</text>
    <rect class="pin-power" x="0" y="800" width="125" height="34" rx="8"/><text class="small" x="14" y="824">5V</text>
    <rect class="pin-gnd" x="0" y="840" width="125" height="34" rx="8"/><text class="small" x="14" y="864">GND</text>
  </g>

  <!-- Breadboard -->
  <rect class="bread" x="560" y="170" width="580" height="930" rx="30"/>
  <text class="label" x="705" y="215">中型面包板</text>

  <!-- rails -->
  <rect class="rail3" x="595" y="255" width="42" height="790" rx="16"/>
  <rect class="railg" x="650" y="255" width="42" height="790" rx="16"/>
  <rect class="rail5" x="1000" y="255" width="42" height="790" rx="16"/>
  <rect class="railg" x="1055" y="255" width="42" height="790" rx="16"/>
  <text class="railText" x="603" y="300" transform="rotate(90 603 300)">3V3 BUTTON VCC</text>
  <text class="railText" x="660" y="300" transform="rotate(90 660 300)">GND COMMON</text>
  <text class="railText" x="1008" y="300" transform="rotate(90 1008 300)">5V LED ONLY</text>
  <text class="railText" x="1065" y="300" transform="rotate(90 1065 300)">GND COMMON</text>

