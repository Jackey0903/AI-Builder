  <!-- Button modules -->
  <g transform="translate(1220,210)">
    <text class="label" x="0" y="0">9 个按钮模块</text>
    <text class="tiny" x="0" y="28">每个按钮有 VCC / GND / SIG 三根线</text>

    <rect class="buttonYellow" x="0" y="60" width="190" height="55" rx="14"/><text class="label" x="20" y="96">Do C -> IO4</text>
    <rect class="buttonYellow" x="0" y="130" width="190" height="55" rx="14"/><text class="label" x="20" y="166">Re D -> IO5</text>
    <rect class="buttonYellow" x="0" y="200" width="190" height="55" rx="14"/><text class="label" x="20" y="236">Mi E -> IO6</text>
    <rect class="buttonYellow" x="0" y="270" width="190" height="55" rx="14"/><text class="label" x="20" y="306">Fa F -> IO7</text>
    <rect class="buttonYellow" x="0" y="340" width="190" height="55" rx="14"/><text class="label" x="20" y="376">Sol G -> IO8</text>
    <rect class="buttonYellow" x="0" y="410" width="190" height="55" rx="14"/><text class="label" x="20" y="446">La A -> IO9</text>
    <rect class="buttonYellow" x="0" y="480" width="190" height="55" rx="14"/><text class="label" x="20" y="516">Si B -> IO10</text>
    <rect class="buttonRed" x="0" y="550" width="190" height="55" rx="14"/><text class="label" x="20" y="586">REC -> IO12</text>
    <rect class="buttonGreen" x="0" y="620" width="190" height="55" rx="14"/><text class="label" x="20" y="656">GEN -> IO13</text>
  </g>

  <!-- LED ring -->
  <g transform="translate(1360,815)">
    <circle cx="145" cy="115" r="90" fill="#101418" stroke="#3a2c31" stroke-width="5"/>
    <circle cx="145" cy="115" r="45" fill="#f6efdc" stroke="#3a2c31" stroke-width="4"/>
    <text class="label" x="-10" y="235">灯环：只接 IN，不接 OUT</text>
    <rect class="pin-power" x="-10" y="255" width="100" height="34" rx="8"/><text class="small" x="10" y="278">VCC</text>
    <rect class="pin-gnd" x="105" y="255" width="100" height="34" rx="8"/><text class="small" x="128" y="278">GND</text>
    <rect class="pin-led" x="220" y="255" width="100" height="34" rx="8"/><text class="small" x="243" y="278">DIN</text>
  </g>

