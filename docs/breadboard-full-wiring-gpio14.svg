      <!-- rows of holes, decorative -->
      <script type="application/ecmascript"><![CDATA[]]></script>
      <circle class="hole" cx="0" cy="0" r="6"/><circle class="hole" cx="30" cy="0" r="6"/><circle class="hole" cx="60" cy="0" r="6"/><circle class="hole" cx="90" cy="0" r="6"/><circle class="hole" cx="120" cy="0" r="6"/>
