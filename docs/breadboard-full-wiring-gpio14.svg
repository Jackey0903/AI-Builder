      <circle class="hole" cx="180" cy="280" r="6"/><circle class="hole" cx="210" cy="280" r="6"/><circle class="hole" cx="240" cy="280" r="6"/><circle class="hole" cx="270" cy="280" r="6"/><circle class="hole" cx="300" cy="280" r="6"/>
      <circle class="hole" cx="0" cy="320" r="6"/><circle class="hole" cx="30" cy="320" r="6"/><circle class="hole" cx="60" cy="320" r="6"/><circle class="hole" cx="90" cy="320" r="6"/><circle class="hole" cx="120" cy="320" r="6"/>
      <circle class="hole" cx="180" cy="320" r="6"/><circle class="hole" cx="210" cy="320" r="6"/><circle class="hole" cx="240" cy="320" r="6"/><circle class="hole" cx="270" cy="320" r="6"/><circle class="hole" cx="300" cy="320" r="6"/>
      <circle class="hole" cx="0" cy="360" r="6"/><circle class="hole" cx="30" cy="360" r="6"/><circle class="hole" cx="60" cy="360" r="6"/><circle class="hole" cx="90" cy="360" r="6"/><circle class="hole" cx="120" cy="360" r="6"/>
      <circle class="hole" cx="180" cy="360" r="6"/><circle class="hole" cx="210" cy="360" r="6"/><circle class="hole" cx="240" cy="360" r="6"/><circle class="hole" cx="270" cy="360" r="6"/><circle class="hole" cx="300" cy="360" r="6"/>
      <circle class="hole" cx="0" cy="400" r="6"/><circle class="hole" cx="30" cy="400" r="6"/><circle class="hole" cx="60" cy="400" r="6"/><circle class="hole" cx="90" cy="400" r="6"/><circle class="hole" cx="120" cy="400" r="6"/>
      <circle class="hole" cx="180" cy="400" r="6"/><circle class="hole" cx="210" cy="400" r="6"/><circle class="hole" cx="240" cy="400" r="6"/><circle class="hole" cx="270" cy="400" r="6"/><circle class="hole" cx="300" cy="400" r="6"/>
      <circle class="hole" cx="0" cy="440" r="6"/><circle class="hole" cx="30" cy="440" r="6"/><circle class="hole" cx="60" cy="440" r="6"/><circle class="hole" cx="90" cy="440" r="6"/><circle class="hole" cx="120" cy="440" r="6"/>
